<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторные работы — CG_Zabelich</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #eef1f5;
      color: #2c3e50;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p.sub { color: #7f8c9a; margin-bottom: 24px; font-size: 14px; }
    ul { list-style: none; }
    li { margin-bottom: 10px; }
    a {
      display: block;
      padding: 14px 18px;
      background: #fafbfc;
      border: 1px solid #e2e6ea;
      border-radius: 10px;
      text-decoration: none;
      color: #2c3e50;
      font-weight: 600;
      transition: all 0.15s;
    }
    a:hover {
      background: #4a90e2;
      border-color: #4a90e2;
      color: #fff;
      transform: translateY(-1px);
    }
    a small {
      display: block;
      font-weight: 400;
      font-size: 12px;
      color: #7f8c9a;
      margin-top: 2px;
    }
    a:hover small { color: rgba(255,255,255,0.85); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Лабораторные работы</h1>
    <p class="sub">CG_Zabelich</p>
    <ul>
      <li>
        <a href="./Lab_1/">

        </a>
      </li>
    </ul>
  </div>
</body>
</html>
